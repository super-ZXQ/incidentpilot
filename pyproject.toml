[project]
name = "incidentpilot"
version = "0.1.0"
description = "AI incident investigation and controlled remediation agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "aiosqlite>=0.20.0",
    "langgraph>=0.2.60",
    "mcp>=1.2.0,<2",
    "httpx>=0.28.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "pyyaml>=6.0.2",
    "greenlet>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incidentpilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires external services",
    "docker: requires Docker daemon",
    "e2e: end-to-end benchmark",
    "mcp: MCP protocol tests",
    "llm: requires real LLM credentials",
    "github: requires real GitHub token",
    "blocked_by_external_env: needs real credentials or external env",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.uvicorn]
factory = true
