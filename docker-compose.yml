services:
  sandbox-image:
    image: incidentpilot-sandbox:py312
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
    command: ["python", "--version"]

  incidentpilot-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: incidentpilot
      POSTGRES_PASSWORD: incidentpilot
      POSTGRES_DB: incidentpilot_app
    ports:
      # 127.0.0.1 only: these credentials are fixed dev values, so a 0.0.0.0 bind
      # would put a writable control plane on the local network.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentpilot -d incidentpilot_app"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - ip_pg_app:/var/lib/postgresql/data

  reference-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reference
      POSTGRES_PASSWORD: reference
      POSTGRES_DB: orders
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reference -d orders"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - ip_pg_ref:/var/lib/postgresql/data
      - ./infra/reference-db-init.sql:/docker-entrypoint-initdb.d/10-readonly.sql:ro

  reference-orders-api:
    build: ./reference/orders_api
    environment:
      REFERENCE_DATABASE_URL: postgresql+psycopg://reference:reference@reference-postgres:5432/orders
      REFERENCE_LOG_FILE: /app/var/logs/orders.jsonl
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      reference-postgres:
        condition: service_healthy
    volumes:
      - ./reference/orders_api/var/logs:/app/var/logs

  prometheus:
    image: prom/prometheus:v2.55.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # Alembic owns the control-plane schema, so it runs as a one-shot before anything
  # that reads or writes agent_runs starts.
  incidentpilot-migrate:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: incidentpilot-app:${GIT_SHA:-local}
    # The image's HEALTHCHECK probes the API port; this container serves nothing.
    healthcheck:
      disable: true
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://incidentpilot:incidentpilot@incidentpilot-postgres:5432/incidentpilot_app
    depends_on:
      incidentpilot-postgres:
        condition: service_healthy
    restart: "no"

  incidentpilot-app:
    image: incidentpilot-app:${GIT_SHA:-local}
    command: ["uvicorn", "incidentpilot.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://incidentpilot:incidentpilot@incidentpilot-postgres:5432/incidentpilot_app
      API_TOKENS: ${API_TOKENS:?set API_TOKENS to a JSON token map, see .env.example}
      # The API never executes runs in-process here; incidentpilot-worker does.
      EMBEDDED_WORKER_ENABLED: "false"
      TOOL_BACKEND: ${TOOL_BACKEND:-mcp}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      GITHUB_INTEGRATION_ENABLED: ${GITHUB_INTEGRATION_ENABLED:-false}
      REFERENCE_ORDERS_API_URL: http://reference-orders-api:8001
      MAX_QUEUED_RUNS: ${MAX_QUEUED_RUNS:-100}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      incidentpilot-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # The durable worker executes the patch/test loop by starting sandbox containers,
  # so it needs the Docker socket, and the workspace it hands to `docker -v` must be
  # addressable by the daemon at the same absolute path. IP_WORKSPACES is the host
  # directory bind-mounted at that identical path and used as TMPDIR.
  # Set IP_WORKSPACES to an absolute path (e.g. $(pwd)/.ip-workspaces) in .env.
  incidentpilot-worker:
    image: incidentpilot-app:${GIT_SHA:-local}
    # No HTTP probe here either. Liveness is the lease: a stalled poll loop stops
    # renewing, the lease expires, and another worker reclaims the run; a crashed one
    # exits the process and `restart: unless-stopped` brings it back.
    healthcheck:
      disable: true
    # The mounted daemon socket is root:root 0660, so uid 65532 needs the root *group*
    # to reach it. This delegates daemon control to the worker; a restricted socket
    # proxy is the alternative for anything beyond a local deployment.
    group_add:
      - "root"
    command: ["python", "-m", "incidentpilot.worker"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://incidentpilot:incidentpilot@incidentpilot-postgres:5432/incidentpilot_app
      TOOL_BACKEND: ${TOOL_BACKEND:-mcp}
      SANDBOX_ENABLED: "true"
      SANDBOX_IMAGE: incidentpilot-sandbox:py312
      SANDBOX_NETWORK: none
      LLM_ENABLED: ${LLM_ENABLED:-false}
      GITHUB_INTEGRATION_ENABLED: ${GITHUB_INTEGRATION_ENABLED:-false}
      REFERENCE_ORDERS_API_URL: http://reference-orders-api:8001
      REFERENCE_REPO_PATH: /reference/orders_api
      # The /reference mount is the same directory the reference API writes its log
      # file into, so read_logs finds it; without this the default relative path
      # resolves under /app and every read_logs call fails.
      REFERENCE_LOGS_PATH: /reference/orders_api/var/logs
      REFERENCE_DB_URL: postgresql://reference_readonly:reference_readonly@reference-postgres:5432/orders
      TMPDIR: ${IP_WORKSPACES:?set IP_WORKSPACES to an absolute host directory for sandbox workspaces}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      # Real queue/lease values live only in this process, so Prometheus scrapes the
      # worker directly. `expose` keeps the endpoint on the compose network instead of
      # publishing an unauthenticated port on the host.
      WORKER_METRICS_PORT: "9102"
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
      JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-15}
      MAX_JOB_ATTEMPTS: ${MAX_JOB_ATTEMPTS:-3}
      RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-900}
    expose:
      - "9102"
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${IP_WORKSPACES:?set IP_WORKSPACES}:${IP_WORKSPACES:?set IP_WORKSPACES}
      - ./reference/orders_api:/reference/orders_api:ro
    depends_on:
      incidentpilot-migrate:
        condition: service_completed_successfully
      sandbox-image:
        condition: service_started
    # The worker handles SIGTERM/SIGINT and finishes in-flight runs before exiting.
    stop_grace_period: 90s
    restart: unless-stopped

volumes:
  ip_pg_app:
  ip_pg_ref:
