name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: incidentpilot
          POSTGRES_PASSWORD: incidentpilot
          POSTGRES_DB: incidentpilot_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentpilot -d incidentpilot_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check .
      # A key misplaced inside `environment:` is a YAML error that only shows up on the
      # laptop that runs `docker compose up` — and it fails quietly for the metrics port,
      # because the worker then never gets its scrape endpoint. The chaos overlay carries
      # the Toxiproxy services and is never started by the default `up`, so it rots
      # silently unless the merged config is checked here too.
      - name: Validate Compose interpolation
        run: |-
          set -euo pipefail
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.chaos.yml config --quiet
        env:
          API_TOKENS: '{}'
          IP_WORKSPACES: /tmp/ip-workspaces
      - name: Alembic upgrade
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://incidentpilot:incidentpilot@127.0.0.1:5432/incidentpilot_app
      - name: Build sandbox for behavioral isolation tests
        run: docker build -f docker/sandbox.Dockerfile -t incidentpilot-sandbox:py312 .
      # The audit fixtures create their own tables, and the schema-bootstrap gate
      # asserts a database with *no* tables, so neither may share the migrated
      # incidentpilot_app that the rest of the suite reads.
      - name: Create disposable test databases
        run: >-
          PGPASSWORD=incidentpilot psql -h 127.0.0.1 -U incidentpilot -d postgres
          -v ON_ERROR_STOP=1
          -c "CREATE DATABASE incidentpilot_audit OWNER incidentpilot"
          -c "CREATE DATABASE incidentpilot_empty OWNER incidentpilot"
      # query_database_readonly refuses any account that is not a dedicated
      # least-privilege role, so without this reference database the role test skips and
      # the guard's privilege checks never run. Tables are created *after* the grants so
      # the ALTER DEFAULT PRIVILEGES path production relies on is the one exercised.
      - name: Create the reference orders database
        run: >-
          PGPASSWORD=incidentpilot psql -h 127.0.0.1 -U incidentpilot -d postgres
          -v ON_ERROR_STOP=1
          -c "CREATE ROLE reference SUPERUSER LOGIN PASSWORD 'reference'"
          -c "CREATE DATABASE orders OWNER reference"
      - name: Grant the readonly audit role and seed the reference schema
        env:
          REFERENCE_SEED_URL: postgresql+psycopg://reference:reference@127.0.0.1:5432/orders
        run: |-
          set -euo pipefail
          PGPASSWORD=reference psql -h 127.0.0.1 -U reference -d orders \
            -v ON_ERROR_STOP=1 -f infra/reference-db-init.sql
          uv run python - <<'PY'
          import os
          import sys

          sys.path.insert(0, "reference/orders_api")
          from app import create_app

          create_app(os.environ["REFERENCE_SEED_URL"])
          PY
      - name: Pytest with coverage
        run: uv run pytest -q --cov=incidentpilot
        env:
          OTEL_CONSOLE_EXPORTER: "false"
          LLM_ENABLED: "false"
          GITHUB_INTEGRATION_ENABLED: "false"
          SANDBOX_ENABLED: "false"
          TOOL_BACKEND: "fake"
          AUDIT_POSTGRES_URL: postgresql+psycopg://incidentpilot:incidentpilot@127.0.0.1:5432/incidentpilot_audit
          POSTGRES_TEST_URL: postgresql://incidentpilot:incidentpilot@127.0.0.1:5432/incidentpilot_app
          POSTGRES_EMPTY_URL: postgresql://incidentpilot:incidentpilot@127.0.0.1:5432/incidentpilot_empty
          AUDIT_REFERENCE_DB_URL: postgresql://reference_readonly:reference_readonly@127.0.0.1:5432/orders
          AUDIT_REFERENCE_ADMIN_URL: postgresql://reference:reference@127.0.0.1:5432/orders
